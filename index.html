<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peter de Kok</title>
  <meta name="description" content="Personal site of Peter de Kok (peterdekok.nl)">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0c10">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="mask-icon" href="favicon.svg" color="#79b8ff">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0a0c10;
      --card-bg: rgba(18, 24, 32, 0.75);
      --card-border: #262c36;
      --card-border-hover: #3b4453;
      --text-main: #f0f6fc;
      --text-muted: #b1bac4;
      --text-dim: #9198a1;
      --accent: #79b8ff;
      --accent-glow: rgba(121, 184, 255, 0.15);
      --font-mono: ui-monospace, "Cascadia Code", "Source Code Pro", Menlo, Monaco, Consolas, monospace;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-mono);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient background grid */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
      -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
    }

    main {
      position: relative;
      z-index: 1;
      padding: 2.5rem 3rem;
      border-radius: 12px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 0 40px var(--accent-glow), 0 20px 40px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 1.5rem;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      max-width: 90vw;
    }

    main:hover {
      border-color: var(--card-border-hover);
      box-shadow: 0 0 50px rgba(88, 166, 255, 0.22), 0 24px 48px rgba(0, 0, 0, 0.5);
    }

    .monogram-container {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.02);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.05em;
      color: var(--text-main);
      user-select: none;
    }

    .monogram-container span {
      background: linear-gradient(135deg, #f0f6fc 0%, #8b949e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .identity {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }

    .domain {
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .tagline {
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: -0.01em;
    }

    .meta-details {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.85rem;
    }

    .meta-item {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .meta-item svg {
      width: 13px;
      height: 13px;
      fill: var(--accent);
      flex-shrink: 0;
    }

    .links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 0.25rem;
      flex-wrap: wrap;
    }

    .link-item {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-decoration: none;
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.02);
      transition: all 0.2s ease;
    }

    .link-item:hover {
      color: var(--text-main);
      border-color: var(--accent);
      background: var(--accent-glow);
    }

    .link-item svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    @media (max-width: 480px) {
      main {
        padding: 2rem 1.75rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="monogram-container" aria-hidden="true">
      <span>PDK</span>
    </div>
    <div class="identity">
      <h1>Peter de Kok</h1>
      <span class="domain">peterdekok.nl</span>
      <div class="meta-details">
        <div class="meta-item" title="Location">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0a5 5 0 0 0-5 5c0 3.75 5 11 5 11s5-7.25 5-11a5 5 0 0 0-5-5zm0 7.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>
          <span>Netherlands</span>
        </div>
        <div class="meta-item" title="Timezone identifier and current offset">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0zm.75 4a.75.75 0 0 0-1.5 0v4.25c0 .2.08.39.22.53l2.5 2.5a.75.75 0 0 0 1.06-1.06L8.75 7.97V4z"/></svg>
          <span>Timezone: Europe/Amsterdam (<span id="tz-offset">UTC+01:00 / CET</span>)</span>
        </div>
      </div>
    </div>
    <nav class="links" aria-label="Profiles and Keys">
      <a href="https://github.com/PeterDeKok" class="link-item" target="_blank" rel="noopener noreferrer" aria-label="GitHub profile">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        <span>GitHub</span>
      </a>
      <a href="https://github.com/PeterDeKok.keys" class="link-item" target="_blank" rel="noopener noreferrer" aria-label="Public SSH Keys">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M0 8a4 4 0 0 1 7.465-2H14a.5.5 0 0 1 .354.146l1.5 1.5a.5.5 0 0 1 0 .708l-.5.5a.5.5 0 0 1-.708 0L14 8.207l-.646.647a.5.5 0 0 1-.708 0L12 8.207l-.646.647a.5.5 0 0 1-.708 0L10 8.207l-.768.768A4 4 0 0 1 0 8zm4-2a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>
        <span>Public Keys</span>
      </a>
    </nav>
  </main>
  <script>
    (function() {
      try {
        const now = new Date();
        const amsStr = now.toLocaleString('en-US', { timeZone: 'Europe/Amsterdam' });
        const utcStr = now.toLocaleString('en-US', { timeZone: 'UTC' });
        const diffMinutes = Math.round((new Date(amsStr) - new Date(utcStr)) / 60000);
        const absMinutes = Math.abs(diffMinutes);
        const hours = String(Math.floor(absMinutes / 60)).padStart(2, '0');
        const mins = String(absMinutes % 60).padStart(2, '0');
        const sign = diffMinutes >= 0 ? '+' : '-';
        const offset = 'UTC' + sign + hours + ':' + mins;
        const code = diffMinutes === 120 ? 'CEST' : (diffMinutes === 60 ? 'CET' : '');
        const el = document.getElementById('tz-offset');
        if (el) {
          el.textContent = code ? offset + ' / ' + code : offset;
        }
      } catch (e) {
        // Fallback remains as rendered
      }
    })();
  </script>
</body>
</html>
